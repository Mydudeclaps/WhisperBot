services:
  whisperbot:
    build:
      context: .
    image: whisperbot:local
    container_name: whisperbot
    restart: unless-stopped
    init: true
    environment:
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
      GUILD_ID: ${GUILD_ID:-1478108083593941063}
      WHISPERBOT_DB_PATH: /data/whisperbot.db
      WHISPERBOT_HEALTH_PATH: /tmp/whisperbot-health.json
      WEGO_DISCORD_CRATE_URL: ${WEGO_DISCORD_CRATE_URL:-https://wego.gg/api/internal/whisperbot/crate-key}
      WEGO_DISCORD_CRATE_SECRET_FILE: /run/secrets/wego_discord_crate_secret
    secrets:
      - discord_token
      - wego_discord_crate_secret
    volumes:
      - whisperbot-data:/data
      - whisperbot-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  whisperbot-data:
  whisperbot-logs:

secrets:
  discord_token:
    file: ${WHISPERBOT_DISCORD_TOKEN_FILE:-/etc/whisperbot/discord_token}
  wego_discord_crate_secret:
    file: ${WHISPERBOT_CRATE_SECRET_FILE:-/etc/whisperbot/wego_discord_crate_secret}
